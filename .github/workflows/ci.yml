name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build MiniDNS (Java ${{ matrix.java }})

    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java:
          - 17
          - 21
    env:
      PRIMARY_JAVA_VERSION: 21

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Caches the Gradle User Home and validates the Gradle wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Pre-reqs
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-19
            platforms;android-23

      # Testing
      - name: Gradle Check
        run: ./gradlew check --stacktrace

      # Test local publish
      - name: Gradle publish
        run: ./gradlew publishToMavenLocal --stacktrace

      # Javadoc
      - name: Javadoc
        if: ${{ matrix.java == env.PRIMARY_JAVA_VERSION }}
        run: ./gradlew javadocAll --stacktrace

      # Test Coverage Report
      - name: Jacoco Test Coverage
        if: ${{ matrix.java == env.PRIMARY_JAVA_VERSION }}
        run: ./gradlew minidns-hla:testCodeCoverageReport

      # Coveralls
      - name: Report coverage stats to Coveralls
        if: ${{ matrix.java == env.PRIMARY_JAVA_VERSION }}
        uses: coverallsapp/github-action@v2
        with:
          format: jacoco
          file: minidns-hla/build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml

      # Upload build artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: minidns-java-${{ matrix.java }}
          path: |
            minidns-*/build/libs/*.jar
            !**/*-test-fixtures.jar
            !**/*-tests.jar
